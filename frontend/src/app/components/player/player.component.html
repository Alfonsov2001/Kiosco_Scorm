<div class="main-layout">

  <header class="app-header">
    <div class="header-left">
      <img src="assets/images/logocampus.png" alt="Logo" class="logo-img" onError="this.style.display='none'">
    </div>
    <div class="header-center">
      <h1>KIOSCO SCORMS</h1>
    </div>
    <div class="header-right">
      <span class="username">{{ nombreUsuario }}</span>
      <button class="btn-salir" (click)="volver()">salir</button>
    </div>
  </header>

  <main class="player-body">

    <div class="course-status-bar" *ngIf="!cargando">
      <div class="course-info">
        <h2 class="course-title">{{ curso?.titulo || 'Cargando título...' }}</h2>
      </div>
    </div>

    <div *ngIf="cargando" class="loading-container">
      <div class="spinner"></div>
      <p>Cargando curso...</p>
    </div>

    <div class="iframe-container" *ngIf="urlSegura && !cargando">
      <iframe 
        #scormFrame
        [src]="urlSegura" 
        class="scorm-iframe" 
        frameborder="0" 
        allowfullscreen
        (load)="onIframeLoad()">
      </iframe>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-left">
      <p>© 2025 Kiosco SCORM.</p>
    </div>
    <div class="footer-right">
      <p class="dev-title">Desarrolladores:</p>
      <ul>
        <li>Equipo de Desarrollo 2º DAM/DAW</li>
      </ul>
    </div>
  </footer>
</div>
