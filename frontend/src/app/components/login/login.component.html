<div class="login-page d-flex align-items-center justify-content-center py-5">
  <div class="card login-card p-4">
    <div class="text-center mb-3">
      <img src="assets/images/logocampus.png" alt="Logo Campus" class="login-logo" onError="this.style.display='none'" />
    </div>

    <h1 class="h3 mb-1 text-center">Bienvenido</h1>
    <p class="text-muted mb-3 text-center">Introduce tu correo para acceder.</p>

    <input
      class="form-control mb-2"
      type="email"
      [(ngModel)]="email"
      placeholder="usuario@ejemplo.com"
      (keyup.enter)="entrar()"
      [disabled]="cargando"
    />

    <div *ngIf="error" class="alert alert-danger py-2 mb-3 small" role="alert">
      {{ error }}
    </div>

    <div *ngIf="!error" class="mb-3"></div>

    <button class="btn btn-primary w-100" (click)="entrar()" [disabled]="cargando">
      <span *ngIf="!cargando">Acceder</span>
      <span *ngIf="cargando">Verificando...</span>
    </button>
  </div>
</div>
